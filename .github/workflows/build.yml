name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck (GraphQL ${{ matrix.graphql-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        graphql-version: [16, 17]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The lockfile pins graphql 16; swap in the latest release of the major
      # under test. --legacy-peer-deps because @apollo/server and mercurius
      # do not declare graphql 17 peer support yet.
      - run: npm i --no-save --legacy-peer-deps graphql@^${{ matrix.graphql-version }}
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Test (Node ${{ matrix.node-version }}, GraphQL ${{ matrix.graphql-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 18 is in the supported engines range but the e2e test servers
        # (@apollo/server 5, fastify 5) require Node >= 20.
        node-version: [20, 22, 24]
        graphql-version: [16, 17]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # The lockfile pins graphql 16; swap in the latest release of the major
      # under test. --legacy-peer-deps because @apollo/server and mercurius
      # do not declare graphql 17 peer support yet (their e2e suites pass on
      # it regardless).
      - run: npm i --no-save --legacy-peer-deps graphql@^${{ matrix.graphql-version }}
      - run: npm test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fails if overall coverage drops below the thresholds configured in
      # vitest.config.ts (80% statements/branches/functions/lines).
      - run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
