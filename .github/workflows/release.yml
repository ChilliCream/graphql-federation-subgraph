name: Release

run-name: "Release / ${{ github.ref_name }}"

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Ensure tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main."
            exit 1
          fi

  build-and-test:
    name: Build & Test
    needs: verify
    uses: ./.github/workflows/build.yml

  release:
    name: Publish
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Set package version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Package
        run: |
          npm run build
          npm pack

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: "*.tgz"

      - name: Publish to npm
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "graphql-federation-subgraph@$version" version >/dev/null 2>&1; then
            echo "graphql-federation-subgraph@$version already on npm — skipping publish"
          else
            npm publish ./graphql-federation-subgraph-*.tgz --access public
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./*.tgz \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
